services:
  agent:
    build:
      context: agent
      dockerfile: agent.Dockerfile
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./agent/agent.py
    stdin_open: true
    tty: true
    volumes:
      - ./agent:/app:ro
      - ./workspace:/workspace
      - ./output:/output
      - hf_cache:/root/.cache/huggingface
    environment:
      PROVIDER: "${PROVIDER}"

volumes:
  hf_cache:
